<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spaceman Reverb VST</title>
  <link rel="stylesheet" href="style.css">
  <!-- defer ensures script executes AFTER the DOM tree is built -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <article class="product-card">
      <img src="plugin-ui.png" alt="Spaceman Reverb VST Interface" class="product-image">
      
      <div class="product-details">
        <h1>Spaceman Reverb</h1>
        <p class="tagline">Vintage algorithmic reverb module for low-latency DSP processing.</p>
        
        <table class="specs-table">
          <tr>
            <td>Formats</td>
            <td>VST3, AU, AAX</td>
          </tr>
          <tr>
            <td>DSP Overhead</td>
            <td>~1.2% single core CPU usage</td>
          </tr>
          <tr>
            <td>Sample Rates</td>
            <td>44.1 kHz – 192 kHz</td>
          </tr>
        </table>

        <div class="purchase-bar">
          <span class="price">$49.00</span>
          <button id="buy-btn" class="btn">Buy Now</button>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
